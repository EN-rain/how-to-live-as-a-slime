<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Anime Slime</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root { --bg: #567890; --fg: #e8f1f8; color-scheme: dark; }
  body { color: var(--fg); }
  :root { --bg: #567890; color-scheme: dark; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  #canvas-container { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas:active { cursor: grabbing; }
  #hud { position: fixed; z-index: 5; pointer-events: none; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;
    top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
    font: 12px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: #eaf4fb; }
  #hud span { background: rgba(16, 32, 48, 0.55); border-radius: 999px; padding: 5px 11px; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
  #hud .hint { color: #bcd3e4; }
</style>

<div id="canvas-container"></div>
<div id="hud"><span id="hudStat"></span><span class="hint">WASD / arrows move · Shift run · drag to orbit · click to poke</span></div>

<script>
const slimeVertexShader = `
  uniform float uTime;
  uniform float uMelt;
  uniform float uJiggleStrength;
  uniform vec3 uImpulsePos;
  uniform vec3 uImpulseVector;
  uniform float uImpulseTime;
  uniform vec3 uMoveDir;
  uniform float uMoveAmt;
  uniform float uCrawl;
  uniform vec3 uLean;
  uniform vec3 uEatPos[6];
  uniform vec3 uEatParam[6];
  uniform vec3 uBoxHalf[6];
  uniform vec3 uPressDir;
  uniform float uPressAmt;
  uniform vec3 uSplatDir;
  uniform float uSplat;
  uniform float uSpread;
  uniform float uWall;
  uniform vec3 uSolidPos[2];
  uniform vec3 uSolidParam[2];
  uniform vec3 uSolidHalf[2];
  uniform vec3 uSolidDir[2];

  varying vec3 vWorldPosition;
  varying vec3 vViewPosition;
  varying vec3 vNormal;
  varying vec3 vWorldNormal;
  varying vec3 vLocalPos;
  varying float vRippleMask;

  // Regular n-gon in xz: x = distance along the nearest face normal (rho*cos), y = apothem. n<3 or n>=12 means round.
  vec2 polyFold(vec2 xz, float n, float R) {
    float rho = length(xz);
    if (n < 2.5 || n >= 12.0) return vec2(rho, R);
    float sector = 6.28318531 / n;
    float ap = R * cos(3.14159265 / n);
    if (rho < 1e-5) return vec2(0.0, ap);
    float ang = atan(xz.x, xz.y);
    float a2 = mod(ang, sector) - 0.5 * sector;
    return vec2(rho * cos(a2), ap);
  }

  // shape = kind + sides*0.01  (kind: 0 box, 1 prism/cylinder, 2 pyramid/cone)
  float sdShape(vec3 q, float shape, vec3 h) {
    float kind = floor(shape + 0.005);
    float n = floor((shape - kind) * 100.0 + 0.5);
    if (kind < 0.5) {
      vec3 a = abs(q) - h;
      return length(max(a, 0.0)) + min(max(a.x, max(a.y, a.z)), 0.0);
    }
    vec2 f = polyFold(q.xz, n, h.x);
    if (kind < 1.5) {
      vec2 d2 = vec2(f.x - f.y, abs(q.y) - h.y);
      return min(max(d2.x, d2.y), 0.0) + length(max(d2, 0.0));
    }
    float r = f.y;
    float H2 = 2.0 * h.y;
    float dSide = (f.x * H2 + (q.y - h.y) * r) / sqrt(H2 * H2 + r * r);
    return max(dSide, -q.y - h.y);
  }

  // Push depth along -n that lifts a point to the offset surface (first-order, from the distance gradient)
  // Push depth along -n that lifts a point to the offset surface: exact exit distance, iterated (stays correct for deep dents)
  float pushAmt(vec3 q, vec3 nL, float shape, vec3 h, float e) {
    float s = 0.0;
    for (int k = 0; k < 4; k++) {
      s += max(e - sdShape(q - nL * s, shape, h), 0.0);
    }
    return s;
  }

  // The depth field is blurred over a small disc of taps in the plane facing the prop, so the dent wall at the
  // prop's silhouette becomes a smooth ramp instead of a cliff the mesh can't resolve.
  vec3 dentPush(vec3 p, vec3 c, float shape, vec3 h, float yaw, float blur, vec3 nOv) {
    float cy = cos(yaw), sy = sin(yaw);
    vec3 dv = p - c;
    vec3 q = vec3(dv.x * cy - dv.z * sy, dv.y, dv.x * sy + dv.z * cy);
    float e = 0.08;
    if (sdShape(q, shape, h) > e + blur * 1.2) return vec3(0.0);
    vec3 n = dot(nOv, nOv) > 0.5 ? nOv : normalize(vec3(c.x, 0.0, c.z) + vec3(0.0001, 0.0, 0.0001));
    vec3 nL = vec3(n.x * cy - n.z * sy, 0.0, n.x * sy + n.z * cy);
    vec3 u = vec3(-nL.z, 0.0, nL.x);
    vec3 v = vec3(0.0, 1.0, 0.0);
    float R = blur;
    float acc = pushAmt(q, nL, shape, h, e) * 0.28;
    acc += pushAmt(q + u * R, nL, shape, h, e) * 0.12;
    acc += pushAmt(q - u * R, nL, shape, h, e) * 0.12;
    acc += pushAmt(q + v * R, nL, shape, h, e) * 0.12;
    acc += pushAmt(q - v * R, nL, shape, h, e) * 0.12;
    acc += pushAmt(q + (u + v) * R * 0.7071, nL, shape, h, e) * 0.06;
    acc += pushAmt(q + (u - v) * R * 0.7071, nL, shape, h, e) * 0.06;
    acc += pushAmt(q + (-u + v) * R * 0.7071, nL, shape, h, e) * 0.06;
    acc += pushAmt(q + (-u - v) * R * 0.7071, nL, shape, h, e) * 0.06;
    return -n * acc;
  }

  vec3 deformSlime(vec3 pos, vec3 norm) {
    vec3 p = pos;

    float height01 = clamp((p.y / 1.6 + 1.0) * 0.5, 0.0, 1.0);
    float bellyCurve = sin(height01 * 3.14159265);
    float lowerBulge = pow(1.0 - height01, 1.35) * smoothstep(0.0, 0.22, height01);
    float bellySpread = 1.0 + (lowerBulge * 0.34 + bellyCurve * 0.08) * (0.8 + uMelt * 1.1);
    p.xz *= bellySpread;

    p.y *= (0.86 - uMelt * 0.22);

    float groundFloor = -1.6 * (0.86 - uMelt * 0.22);

    float baseH = p.y - groundFloor;
    if (baseH < 0.9) {
      float tB = clamp(baseH / 0.9, 0.0, 1.0);
      p.y = groundFloor + 0.9 * (2.0 * tB * tB - tB * tB * tB);
    }

    float breathe = sin(uTime * 2.0) * 0.022 * uJiggleStrength;
    p.y *= (1.0 + breathe);
    p.xz *= (1.0 - breathe * 0.45);

    float gentleSway = sin(p.y * 2.2 - uTime * 2.4) * 0.012 * uJiggleStrength;
    p.xz += norm.xz * gentleSway * smoothstep(0.05, 0.5, height01);

    float distToPoke = distance(pos, uImpulsePos);
    float pokeInfluence = exp(-distToPoke * 1.15);
    float springOsc = sin(uImpulseTime * 14.0) * exp(-uImpulseTime * 3.0);
    vec3 impulseOffset = uImpulseVector * pokeInfluence * springOsc * uJiggleStrength;

    float globalBounce = sin(uImpulseTime * 11.0) * exp(-uImpulseTime * 2.6) * length(uImpulseVector) * 0.32 * uJiggleStrength;
    p.y += globalBounce * (height01 - 0.15);
    p.xz -= globalBounce * 0.38 * p.xz * (1.0 - height01 * 0.5);

    p += impulseOffset * smoothstep(0.02, 0.25, height01);

    for (int i = 0; i < 6; i++) {
      if (uEatParam[i].y > 0.001) {
        p += dentPush(p, uEatPos[i], uEatParam[i].x, uBoxHalf[i], uEatParam[i].z, 0.26, vec3(0.0)) * uEatParam[i].y;
      }
    }
    if (uPressAmt > 0.001) {
      vec2 pd2 = normalize(uPressDir.xz + vec2(0.0001));
      float al = dot(p.xz, pd2);
      vec2 pp = p.xz - pd2 * al;
      float anchor = 1.9;
      al = anchor + (al - anchor) * (1.0 - 0.12 * uPressAmt);
      p.xz = pd2 * al + pp * (1.0 + 0.07 * uPressAmt);
      p.y = groundFloor + (p.y - groundFloor) * (1.0 + 0.05 * uPressAmt);
    }
    if (uSplat > 0.001 || uSpread > 0.001) {
      // Splat model: the body compresses toward the wall (anchored at the contact plane), the top carries on forward
      // while the floor-gripping base lags, the face that touches the wall is pressed flat, and the mass spreads
      // sideways/up with a slower lag (viscous) than the compression itself.
      vec2 sd = normalize(uSplatDir.xz + vec2(0.0001));
      float sa = dot(p.xz, sd);
      vec2 sperp = p.xz - sd * sa;
      float wallS = uWall;
      sa = wallS + (sa - wallS) * (1.0 - 0.34 * uSplat);
      sa += uSplat * 0.16 * (height01 - 0.15);
      // no flat cut here any more: the obstacle's real outline is carved into the body by the solid dent below
      p.xz = sd * sa + sperp * (1.0 + 0.34 * uSpread);
      p.y = groundFloor + (p.y - groundFloor) * (1.0 + 0.10 * uSpread);
    }
    p.y = max(p.y, groundFloor);

    float wave = 0.5 + 0.5 * sin(uCrawl);
    float sy = 1.0 + uMoveAmt * (0.10 * wave - 0.04);
    p.xz *= 1.0 / sqrt(sy);
    p.y = groundFloor + (p.y - groundFloor) * sy;
    vec2 d = normalize(uMoveDir.xz + vec2(0.0001));
    p.xz -= uLean.xz * (height01 - 0.2) * 0.38;
    float tw = sin(uCrawl - dot(pos.xz, d) * 2.8);
    float twMask = smoothstep(0.1, 0.6, height01);
    p.y += uMoveAmt * 0.07 * tw * twMask;
    p.xz += norm.xz * uMoveAmt * 0.03 * tw * twMask;

    // Wrap the body around whatever it is squashed against: a face gives a flat patch, a corner gives a V-shaped notch.
    for (int i = 0; i < 1; i++) {
      if (uSolidParam[i].y > 0.001) {
        // the jelly rises in a soft ring around the contact (the displaced volume has to go somewhere), then the exact outline is carved in
        float ring = length(dentPush(p, uSolidPos[i], uSolidParam[i].x, uSolidHalf[i], uSolidParam[i].z, 0.55, uSolidDir[i]));
        p += norm * ring * 0.3 * uSolidParam[i].y;
        p += dentPush(p, uSolidPos[i], uSolidParam[i].x, uSolidHalf[i], uSolidParam[i].z, 0.15, uSolidDir[i]) * uSolidParam[i].y;
      }
    }

    return p;
  }

  void main() {
    vLocalPos = position;

    vec3 tangent = normalize(cross(normal, vec3(0.0, 1.0, 0.1)));
    if (length(tangent) < 0.01) tangent = normalize(cross(normal, vec3(1.0, 0.0, 0.0)));
    vec3 bitangent = normalize(cross(normal, tangent));
    float eps = 0.025;

    vec3 p0 = deformSlime(position, normal);
    vec3 p1 = deformSlime(position + tangent * eps, normalize(position + tangent * eps));
    vec3 p2 = deformSlime(position + bitangent * eps, normalize(position + bitangent * eps));

    vec3 deformedNormal = normalize(cross(p1 - p0, p2 - p0));

    vec4 worldPos = modelMatrix * vec4(p0, 1.0);
    vWorldPosition = worldPos.xyz;

    vec4 mvPosition = viewMatrix * worldPos;
    vViewPosition = -mvPosition.xyz;

    vNormal = normalize(normalMatrix * deformedNormal);
    vWorldNormal = normalize(mat3(modelMatrix) * deformedNormal);

    float distToPoke = distance(position, uImpulsePos);
    vRippleMask = exp(-distToPoke * 1.5) * exp(-uImpulseTime * 2.5);

    gl_Position = projectionMatrix * mvPosition;
  }
`;

const slimeFragmentShader = `
  precision highp float;

  uniform sampler2D tRefraction;
  uniform vec2 uResolution;
  uniform float uTime;
  uniform float uDispersion;
  uniform float uRefractionStrength;
  uniform float uRippleIntensity;
  uniform float uRimStrength;
  uniform float uOpacity;
  uniform float uNightMode;
  uniform vec3 uLightDir;
  uniform float uFacing;
  uniform float uBlink;

  varying vec3 vWorldPosition;
  varying vec3 vViewPosition;
  varying vec3 vNormal;
  varying vec3 vWorldNormal;
  varying vec3 vLocalPos;
  varying float vRippleMask;

  vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
  vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}

  float snoise(vec3 v){
    const vec2 C = vec2(1.0/6.0, 1.0/3.0);
    const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
    vec3 i  = floor(v + dot(v, C.yyy));
    vec3 x0 = v - i + dot(i, C.xxx);
    vec3 g = step(x0.yzx, x0.xyz);
    vec3 l = 1.0 - g;
    vec3 i1 = min(g.xyz, l.zxy);
    vec3 i2 = max(g.xyz, l.zxy);
    vec3 x1 = x0 - i1 + 1.0 * C.xxx;
    vec3 x2 = x0 - i2 + 2.0 * C.xxx;
    vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;
    i = mod(i, 289.0);
    vec4 p = permute(permute(permute(
              i.z + vec4(0.0, i1.z, i2.z, 1.0))
            + i.y + vec4(0.0, i1.y, i2.y, 1.0))
            + i.x + vec4(0.0, i1.x, i2.x, 1.0));
    float n_ = 1.0/7.0;
    vec3 ns = n_ * D.wyz - D.xzx;
    vec4 j = p - 49.0 * floor(p * ns.z *ns.z);
    vec4 x_ = floor(j * ns.z);
    vec4 y_ = floor(j - 7.0 * x_);
    vec4 x = x_ *ns.x + ns.yyyy;
    vec4 y = y_ *ns.x + ns.yyyy;
    vec4 h = 1.0 - abs(x) - abs(y);
    vec4 b0 = vec4(x.xy, y.xy);
    vec4 b1 = vec4(x.zw, y.zw);
    vec4 s0 = floor(b0)*2.0 + 1.0;
    vec4 s1 = floor(b1)*2.0 + 1.0;
    vec4 sh = -step(h, vec4(0.0));
    vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
    vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
    vec3 p0 = vec3(a0.xy,h.x);
    vec3 p1 = vec3(a0.zw,h.y);
    vec3 p2 = vec3(a1.xy,h.z);
    vec3 p3 = vec3(a1.zw,h.w);
    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
    vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
    m = m * m;
    return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
  }

  void main() {
    vec2 screenUV = gl_FragCoord.xy / uResolution;
    vec3 viewDir = normalize(vViewPosition);
    vec3 normal = normalize(vNormal);
    vec3 worldNormal = normalize(vWorldNormal);

    vec3 noiseCoord = vWorldPosition * 1.65 + vec3(0.0, -uTime * 0.45, uTime * 0.25);
    float n1 = snoise(noiseCoord);
    float n2 = snoise(noiseCoord * 1.8 - vec3(uTime * 0.35));

    float ndotv = max(0.0, dot(normal, viewDir));
    float edgeFactor = pow(1.0 - ndotv, 1.5);

    vec2 rippleOffset = vec2(n1 * 0.7 + n2 * 0.3, n2 * 0.7 - n1 * 0.3)
      * 0.012 * uRippleIntensity * (0.35 + 0.65 * edgeFactor + vRippleMask * 1.2);

    vec2 lensOffset = normal.xy * (0.065 * uRefractionStrength);
    vec2 totalDistortion = lensOffset + rippleOffset;

    float disp = 0.009 * uDispersion;
    vec2 dir = normalize(totalDistortion + vec2(0.0001));

    vec2 uvR  = clamp(screenUV - totalDistortion * (1.0 - 0.18 * uDispersion) + dir * disp * 0.4, 0.002, 0.998);
    vec2 uvG  = clamp(screenUV - totalDistortion * 1.0, 0.002, 0.998);
    vec2 uvGY = clamp(screenUV - totalDistortion * (1.0 + 0.10 * uDispersion) - dir * disp * 0.25, 0.002, 0.998);
    vec2 uvB  = clamp(screenUV - totalDistortion * (1.0 + 0.22 * uDispersion) - dir * disp * 0.55, 0.002, 0.998);

    vec3 sampleR  = texture2D(tRefraction, uvR).rgb;
    vec3 sampleG  = texture2D(tRefraction, uvG).rgb;
    vec3 sampleGY = texture2D(tRefraction, uvGY).rgb;
    vec3 sampleB  = texture2D(tRefraction, uvB).rgb;

    vec3 refractedColor = vec3(sampleR.r, mix(sampleG.g, sampleGY.g, 0.5), sampleB.b);

    float edgeDelta = clamp(length(sampleG - sampleB) * 1.5, 0.0, 0.45);
    vec3 greenCyanCaustic = mix(vec3(0.18, 0.92, 0.62), vec3(0.42, 0.98, 0.35), n1 * 0.5 + 0.5);
    float basalMask = smoothstep(0.05, -0.72, vLocalPos.y) * smoothstep(0.1, 0.85, 1.0 - ndotv);
    refractedColor += greenCyanCaustic * edgeDelta * 0.45 * uDispersion;
    refractedColor = mix(refractedColor, greenCyanCaustic * 0.92, basalMask * 0.28 * clamp(uDispersion, 0.0, 1.4));

    float fresnel = pow(1.0 - ndotv, 2.6);

    vec3 dayShallowColor = vec3(0.52, 0.82, 0.98);
    vec3 dayDeepColor    = vec3(0.28, 0.62, 0.90);
    vec3 nightShallowColor = vec3(0.22, 0.64, 0.94);
    vec3 nightDeepColor    = vec3(0.08, 0.32, 0.64);

    vec3 shallowTint = mix(dayShallowColor, nightShallowColor, uNightMode);
    vec3 deepTint    = mix(dayDeepColor, nightDeepColor, uNightMode);

    float thickness = pow(ndotv, 0.65);
    vec3 jellyTint = mix(shallowTint, deepTint, thickness);

    float effectiveOpacity = clamp(uOpacity * (0.72 + 0.48 * thickness), 0.05, 0.95);
    vec3 color = mix(refractedColor, jellyTint, effectiveOpacity);

    float topGradient = smoothstep(-0.8, 1.0, worldNormal.y);
    color += vec3(0.08, 0.18, 0.28) * topGradient * (1.0 - uNightMode * 0.4);

    float innerRim = smoothstep(0.38, 0.82, fresnel) * uRimStrength;
    vec3 rimColor = mix(vec3(0.80, 0.96, 1.0), vec3(0.62, 0.92, 1.0), uNightMode);
    color = mix(color, rimColor, clamp(innerRim * 0.78, 0.0, 0.92));

    vec3 localP = vLocalPos * 3.5 + vec3(0.0, uTime * 0.6, 0.0);
    float bubbleNoise1 = snoise(localP);
    float bubbleNoise2 = snoise(localP * 2.2 - vec3(0.0, uTime * 1.1, 0.0));
    float bubbleField = smoothstep(0.55, 0.72, bubbleNoise1) * smoothstep(0.4, 0.6, bubbleNoise2);
    float depthFactor = smoothstep(-0.8, 0.6, vLocalPos.y);
    vec3 bubbleColor = vec3(0.85, 1.0, 0.95) * 1.4;
    color = mix(color, bubbleColor, bubbleField * depthFactor * 0.55 * clamp(uRippleIntensity * 2.0, 0.2, 1.5));

    vec3 lp = normalize(vLocalPos);
    float eyeYaw = atan(lp.x, lp.z) - uFacing;
    eyeYaw = atan(sin(eyeYaw), cos(eyeYaw));
    float eyeElev = asin(clamp(lp.y, -1.0, 1.0));
    vec2 eq = vec2((abs(eyeYaw) - 0.32) / 0.11, (eyeElev - 0.12) / (0.17 * uBlink));
    float eyeMask = 1.0 - smoothstep(0.82, 1.0, length(eq));
    color = mix(color, vec3(1.0), eyeMask * 0.97);

    vec3 halfVec = normalize(uLightDir + viewDir);

    float celOutline = smoothstep(0.84, 0.95, 1.0 - ndotv);
    vec3 outlineColor = mix(vec3(0.16, 0.34, 0.52), vec3(0.04, 0.12, 0.24), uNightMode);
    color = mix(color, outlineColor, celOutline * 0.55 * clamp(uRimStrength, 0.0, 1.5));

    gl_FragColor = vec4(color, 1.0);
  }
`;

let scene, camera, renderer, refractionRenderTarget;
let slimeMesh, slimeMaterial;
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

const cameraState = {
  theta: 0.45, phi: 1.18, radius: 5.4,
  target: new THREE.Vector3(0, 0.15, 0),
  isDragging: false, prevX: 0, prevY: 0
};

const slimeState = { time: 0, impulseTime: 10.0 };
const keys = {};
const velocity = new THREE.Vector3();
const _fwd = new THREE.Vector3(), _right = new THREE.Vector3(), _desired = new THREE.Vector3();
const UP = new THREE.Vector3(0, 1, 0);
const crawlDir = new THREE.Vector3(0, 0, 1);
let crawlPhase = 0;
let facingYaw = 0.45;
const props = [];
const insideProps = [];
let slimeScale = 1, targetScale = 1, lastScale = 1, pressAmt = 0, calm = 0, curMax = 3;
const lean = new THREE.Vector3(), leanVel = new THREE.Vector3(), _t = new THREE.Vector3();
let impactAmt = 0, eaten = 0, hudText = '';
let splatX = 0, splatV = 0, spreadX = 0, spreadV = 0, touchTime = -10, frameDt = 0.016, contactR = 2.15;
let sharpAmt = 0; // 0 = flat face contact, 1 = sharp corner contact
const impactDir = new THREE.Vector3(0, 0, 1);

function init() {
  const container = document.getElementById('canvas-container');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x567890);

  camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
  updateCameraPosition();

  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const dpr = renderer.getPixelRatio();
  refractionRenderTarget = new THREE.WebGLRenderTarget(window.innerWidth * dpr, window.innerHeight * dpr, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat
  });

  scene.add(new THREE.AmbientLight(0xdbeafe, 0.85));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(4, 8, 5);
  scene.add(dirLight);

  createStudioFloor();
  createSlime();
  createProps();
  setupEvents();
  animate();
}

function createStudioFloor() {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#6f7d8c';
  ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = 'rgba(210, 232, 250, 0.55)';
  ctx.lineWidth = 4;
  ctx.strokeRect(0, 0, size, size);
  ctx.strokeStyle = 'rgba(210, 232, 250, 0.18)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(size / 2, 0); ctx.lineTo(size / 2, size);
  ctx.moveTo(0, size / 2); ctx.lineTo(size, size / 2);
  ctx.stroke();

  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(100, 100);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const floorGeo = new THREE.PlaneGeometry(400, 400);
  floorGeo.rotateX(-Math.PI / 2);
  const floor = new THREE.Mesh(floorGeo, new THREE.MeshStandardMaterial({
    map: tex, roughness: 0.95, metalness: 0.0
  }));
  floor.position.y = -1.2;
  scene.add(floor);
  scene.fog = new THREE.Fog(0x567890, 25, 90);

  const sc = document.createElement('canvas');
  sc.width = sc.height = 128;
  const sx = sc.getContext('2d');
  const sg = sx.createRadialGradient(64, 64, 4, 64, 64, 64);
  sg.addColorStop(0, 'rgba(10,20,35,0.6)');
  sg.addColorStop(0.7, 'rgba(10,20,35,0.35)');
  sg.addColorStop(1, 'rgba(10,20,35,0)');
  sx.fillStyle = sg;
  sx.fillRect(0, 0, 128, 128);
  const shadowGeo = new THREE.PlaneGeometry(4.0, 4.0);
  shadowGeo.rotateX(-Math.PI / 2);
  const shadow = new THREE.Mesh(shadowGeo, new THREE.MeshBasicMaterial({
    map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false, fog: false
  }));
  shadow.position.y = -1.19;
  scene.add(shadow);
  scene.userData.shadow = shadow;
}

function createSlime() {
  const dpr = renderer.getPixelRatio();
  slimeMaterial = new THREE.ShaderMaterial({
    vertexShader: slimeVertexShader,
    fragmentShader: slimeFragmentShader,
    uniforms: {
      tRefraction: { value: refractionRenderTarget.texture },
      uResolution: { value: new THREE.Vector2(window.innerWidth * dpr, window.innerHeight * dpr) },
      uTime: { value: 0 },
      uMelt: { value: 0.28 },
      uJiggleStrength: { value: 1.0 },
      uImpulsePos: { value: new THREE.Vector3(0, 0.5, 1) },
      uImpulseVector: { value: new THREE.Vector3(0, 0, 0) },
      uImpulseTime: { value: 10.0 },
      uMoveDir: { value: new THREE.Vector3(0, 0, 1) },
      uMoveAmt: { value: 0 },
      uCrawl: { value: 0 },
      uLean: { value: new THREE.Vector3() },
      uEatPos: { value: Array.from({ length: 6 }, () => new THREE.Vector3()) },
      uEatParam: { value: Array.from({ length: 6 }, () => new THREE.Vector3()) },
      uBoxHalf: { value: Array.from({ length: 6 }, () => new THREE.Vector3(0.01, 0.01, 0.01)) },
      uPressDir: { value: new THREE.Vector3(0, 0, 1) },
      uPressAmt: { value: 0 },
      uSplatDir: { value: new THREE.Vector3(0, 0, 1) },
      uSplat: { value: 0 },
      uSpread: { value: 0 },
      uWall: { value: 2.15 },
      uSolidPos: { value: Array.from({ length: 2 }, () => new THREE.Vector3()) },
      uSolidParam: { value: Array.from({ length: 2 }, () => new THREE.Vector3()) },
      uSolidHalf: { value: Array.from({ length: 2 }, () => new THREE.Vector3(0.01, 0.01, 0.01)) },
      uSolidDir: { value: Array.from({ length: 2 }, () => new THREE.Vector3()) },
      uDispersion: { value: 0.85 },
      uRefractionStrength: { value: 0.32 },
      uRippleIntensity: { value: 0.12 },
      uRimStrength: { value: 1.15 },
      uOpacity: { value: 0.48 },
      uNightMode: { value: 0.0 },
      uFacing: { value: 0.45 },
      uBlink: { value: 1.0 },
      uLightDir: { value: new THREE.Vector3(0.5, 0.8, 0.4).normalize() }
    }
  });
  slimeMesh = new THREE.Mesh(new THREE.SphereGeometry(1.6, 160, 120), slimeMaterial);
  scene.add(slimeMesh);
}

function triggerSlimePoke(localHitPoint, impulseDirection) {
  slimeState.impulseTime = 0.001;
  slimeMaterial.uniforms.uImpulsePos.value.copy(localHitPoint);
  slimeMaterial.uniforms.uImpulseVector.value.copy(impulseDirection);
}

function updateCameraPosition() {
  camera.position.x = cameraState.target.x + cameraState.radius * Math.sin(cameraState.phi) * Math.sin(cameraState.theta);
  camera.position.y = cameraState.target.y + cameraState.radius * Math.cos(cameraState.phi);
  camera.position.z = cameraState.target.z + cameraState.radius * Math.sin(cameraState.phi) * Math.cos(cameraState.theta);
  camera.lookAt(cameraState.target);
}

function setupEvents() {
  const dom = renderer.domElement;

  dom.addEventListener('pointerdown', (e) => {
    const rect = dom.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObject(slimeMesh);
    if (hits.length > 0) {
      const hit = hits[0];
      const localPoint = hit.point.clone().sub(slimeMesh.position).normalize().multiplyScalar(1.6);
      const pushDir = hit.point.clone().sub(camera.position).normalize().multiplyScalar(0.55);
      pushDir.y -= 0.25;
      triggerSlimePoke(localPoint, pushDir);
    }
    cameraState.isDragging = true;
    cameraState.prevX = e.clientX;
    cameraState.prevY = e.clientY;
  });

  window.addEventListener('pointermove', (e) => {
    if (!cameraState.isDragging) return;
    const dx = e.clientX - cameraState.prevX;
    const dy = e.clientY - cameraState.prevY;
    cameraState.prevX = e.clientX;
    cameraState.prevY = e.clientY;
    cameraState.theta -= dx * 0.007;
    cameraState.phi = Math.max(0.35, Math.min(Math.PI * 0.48, cameraState.phi - dy * 0.007));
    updateCameraPosition();
  });

  window.addEventListener('pointerup', () => { cameraState.isDragging = false; });
  window.addEventListener('pointercancel', () => { cameraState.isDragging = false; });

  const moveKeys = ['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowLeft','ArrowDown','ArrowRight'];
  window.addEventListener('keydown', (e) => {
    if (moveKeys.includes(e.code)) { keys[e.code] = true; e.preventDefault(); }
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys[e.code] = true;
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  dom.addEventListener('wheel', (e) => {
    e.preventDefault();
    cameraState.radius = Math.max(3.0 * slimeScale, Math.min(9.5 * slimeScale, cameraState.radius + e.deltaY * 0.003));
    updateCameraPosition();
  }, { passive: false });

  window.addEventListener('resize', () => {
    const w = window.innerWidth, h = window.innerHeight, dpr = renderer.getPixelRatio();
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    refractionRenderTarget.setSize(w * dpr, h * dpr);
    slimeMaterial.uniforms.uResolution.value.set(w * dpr, h * dpr);
  });
}

function createProps() {
  const makers = [
    () => new THREE.BoxGeometry(1.4, 1.4, 1.4),
    () => new THREE.BoxGeometry(1.4, 1.4, 1.4),
    () => new THREE.BoxGeometry(2, 0.9, 1.2),
    () => new THREE.BoxGeometry(1, 2.2, 1),
    () => new THREE.CylinderGeometry(0.8, 0.8, 1.6, 6),
    () => new THREE.CylinderGeometry(0.8, 0.8, 1.2, 20),
    () => new THREE.CylinderGeometry(0.9, 0.9, 1.4, 3),
    () => { const g = new THREE.ConeGeometry(1, 1.8, 4).rotateY(Math.PI / 4); g.userData.phase = Math.PI / 4; return g; },
    () => new THREE.ConeGeometry(1, 1.8, 16)
  ];
  for (let i = 0; i < 36; i++) {
    const geo = makers[Math.floor(Math.random() * makers.length)]();
    geo.computeBoundingBox();
    const radius = 0.4 + Math.pow(Math.random(), 1.6) * 2.8;
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(Math.random(), 0.65, 0.62),
      roughness: 0.55, metalness: 0.05, flatShading: true
    });
    mat.userData.uDissolve = { value: 0 };
    mat.onBeforeCompile = (shader) => {
      shader.uniforms.uDissolve = mat.userData.uDissolve;
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vObjPos;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvObjPos = position;');
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', `#include <common>
          uniform float uDissolve;
          varying vec3 vObjPos;
          float dh(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
          float dvn(vec3 p){
            vec3 i = floor(p); vec3 f = fract(p); f = f * f * (3.0 - 2.0 * f);
            return mix(
              mix(mix(dh(i), dh(i + vec3(1.0,0.0,0.0)), f.x), mix(dh(i + vec3(0.0,1.0,0.0)), dh(i + vec3(1.0,1.0,0.0)), f.x), f.y),
              mix(mix(dh(i + vec3(0.0,0.0,1.0)), dh(i + vec3(1.0,0.0,1.0)), f.x), mix(dh(i + vec3(0.0,1.0,1.0)), dh(i + vec3(1.0,1.0,1.0)), f.x), f.y),
              f.z);
          }`)
        .replace('#include <clipping_planes_fragment>', `#include <clipping_planes_fragment>
          float dn = dvn(vObjPos * 3.0);
          float dth = uDissolve * 1.25 - 0.1;
          if (dn < dth) discard;`)
        .replace('#include <dithering_fragment>', `#include <dithering_fragment>
          float dedge = 1.0 - smoothstep(0.0, 0.1, dn - dth);
          gl_FragColor.rgb += vec3(0.25, 1.0, 0.7) * dedge * 2.5 * step(0.001, uDissolve);`);
    };
    const mesh = new THREE.Mesh(geo, mat);
    mesh.scale.setScalar(radius);
    const fp = radius * 1.25;
    let placed = false;
    for (let tries = 0; tries < 80 && !placed; tries++) {
      const ang = Math.random() * Math.PI * 2;
      const dist = i < 12 ? 6 + Math.random() * 12 : 16 + Math.random() * 60;
      const x = Math.cos(ang) * dist, z = Math.sin(ang) * dist;
      if (Math.hypot(x, z) < fp + 4) continue;
      if (props.some(q => Math.hypot(q.mesh.position.x - x, q.mesh.position.z - z) < q.fp + fp + 0.6)) continue;
      mesh.position.set(x, -1.2 - geo.boundingBox.min.y * radius, z);
      placed = true;
    }
    if (!placed) { geo.dispose(); mat.dispose(); continue; }
    mesh.rotation.y = Math.random() * Math.PI * 2;
    scene.add(mesh);
    props.push({ mesh, radius, fp, state: 'idle', t: 0, pd: 0, pv: 0, pRo: 0, pThr: 1,
      shape: geo.type === 'BoxGeometry' ? 0 : (geo.type === 'ConeGeometry' ? 2 : 1),
      baseR: (geo.parameters.radius ?? geo.parameters.radiusTop ?? 1),
      sides: geo.parameters.radialSegments ?? 0, phase: geo.userData.phase ?? 0,
      start: new THREE.Vector3(), off: new THREE.Vector3(), vel: new THREE.Vector3(),
      half: geo.boundingBox.max.clone().sub(geo.boundingBox.min).multiplyScalar(0.5) });
  }
}

function updateProps(dt) {
  const S = slimeScale, sr = 1.8 * S, sp = slimeMesh.position;
  insideProps.length = 0;
  for (const p of props) {
    if (p.state === 'gone') continue;
    const m = p.mesh;
    if (p.state === 'idle') {
      const dx = m.position.x - sp.x, dz = m.position.z - sp.z;
      const d = Math.max(Math.hypot(dx, dz), 1e-4);
      if (p.radius < sr * 0.75) {
        const he0 = halfOf(p), ca = Math.cos(m.rotation.y), sa = Math.sin(m.rotation.y);
        const ro = p.shape === 0
          ? Math.abs((dx * ca - dz * sa) / d) * he0.x + Math.abs((dx * sa + dz * ca) / d) * he0.z
          : polySupport(p, -dx / d, -dz / d) * (p.shape === 2 ? 0.6 : 1);
        const srP = slimeSurfR((m.position.y - sp.y) / S) * S;
        const target = Math.max(0, srP + ro - d);
        const q = Math.min(1, p.radius / (sr * 0.75));
        const thr = ro * (0.85 + 0.45 * q) + 0.1 * S;
        const press01 = Math.min(target / thr, 1);
        const acc = 140 * (target - p.pd) - 8 * p.pv;
        p.pv += acc * dt; p.pd += p.pv * dt;
        if (p.pd < 0) { p.pd = 0; if (p.pv < 0) p.pv = 0; }
        p.pRo = ro; p.pThr = thr;
        if (press01 > 0) {
          const nx0 = dx / d, nz0 = dz / d;
          const x = Math.min(press01 / 0.85, 1), e = x * x * (3 - 2 * x);
          const cap = curMax * (1 - (0.3 + 0.65 * q * q) * e);
          const vin = velocity.x * nx0 + velocity.z * nz0;
          if (vin > cap) { velocity.x -= nx0 * (vin - cap); velocity.z -= nz0 * (vin - cap); }
        }
        p.hold = target >= thr ? (p.hold || 0) + dt : Math.max(0, (p.hold || 0) - dt * 2);
        if (target >= thr && p.hold >= 0.12 + 0.4 * q) {
          p.pd = 0; p.pv = 0;
          p.state = 'eating'; eaten++; p.t = 0; p.start.copy(m.position);
          p.off.set((Math.random() - 0.5), -0.1 + Math.random() * 0.3, (Math.random() - 0.5));
          m.material.side = THREE.DoubleSide;
          targetScale = Math.cbrt(Math.pow(targetScale, 3) + Math.pow(p.radius, 3) * 0.3);
          triggerSlimePoke(
            new THREE.Vector3(0, 0.2, 0),
            new THREE.Vector3(0, -0.4, 0)
          );
        }
      } else {
        collideSolid(p);
      }
    } else {
      p.t += dt;
      const k = Math.min(p.t / 0.8, 1), e = k * k * (3 - 2 * k);
      if (p.t < 0.8) {
        m.position.set(
          p.start.x + (sp.x + p.off.x * S - p.start.x) * e,
          p.start.y + (sp.y + p.off.y * S - p.start.y) * e,
          p.start.z + (sp.z + p.off.z * S - p.start.z) * e
        );
        p.vel.set(0, 0, 0);
      } else {
        insideProps.push(p);
      }
      const dis = Math.max(0, 1 - Math.max(0, p.t - 0.8) / 2);
      m.scale.setScalar(Math.max(0.001, p.radius * (1 - 0.3 * e) * (0.65 + 0.35 * dis)));
      m.material.userData.uDissolve.value = 1 - dis;
      m.rotation.y += dt * 0.4;
      if (dis <= 0) {
        scene.remove(m); m.geometry.dispose(); m.material.dispose(); p.state = 'gone';
      }
    }
  }
}


// Solid obstacle (too big to eat): shape-aware push-out with a small skin, bounce, and ripple.
function collideSolid(p) {
  const S = slimeScale, sp = slimeMesh.position, m = p.mesh;
  const dx = m.position.x - sp.x, dz = m.position.z - sp.z;
  const d = Math.max(Math.hypot(dx, dz), 1e-4);
        // Solid obstacle: too big to eat. Resolve per-shape so the jelly rests against it instead of overlapping.
        const he = halfOf(p);
        if (d - Math.hypot(he.x, he.z) > 2.8 * S) return;
        const baseY = m.position.y - he.y, topY = m.position.y + he.y;
        const yLo = Math.max(baseY, -1.2), yHi = Math.min(topY, sp.y + 1.0 * S);
        if (yHi >= yLo) {
          let pen = 0, nx = 0, nz = 0, cR = 0, sharp = 0;
          const N = 5;
          if (p.shape === 0) {
            let R = 0;
            for (let k = 0; k < N; k++) {
              const y = yLo + (yHi - yLo) * k / (N - 1);
              R = Math.max(R, (slimeSurfR((y - sp.y) / S) * S + 0.06 * S));
            }
            cR = R;
            const c = Math.cos(m.rotation.y), sn = Math.sin(m.rotation.y);
            const wx = -dx, wz = -dz;
            const lx = wx * c - wz * sn, lz = wx * sn + wz * c;
            const cx = Math.max(-he.x, Math.min(he.x, lx)), cz = Math.max(-he.z, Math.min(he.z, lz));
            let ex = lx - cx, ez = lz - cz;
            const dd = Math.hypot(ex, ez);
            // pointiness: both axes past the box extents = corner; fades smoothly to 0 as the slime rounds onto a face
            { const ox = Math.abs(lx) - he.x, oz = Math.abs(lz) - he.z, t = Math.max(0, Math.min(1, Math.min(ox, oz) / (0.22 * R))); sharp = t * t * (3 - 2 * t); }
            if (dd < R) {
              if (dd > 1e-4) { ex /= dd; ez /= dd; pen = R - dd; }
              else {
                const px = he.x - Math.abs(lx), pz = he.z - Math.abs(lz);
                if (px < pz) { ex = Math.sign(lx) || 1; ez = 0; pen = px + R; }
                else { ex = 0; ez = Math.sign(lz) || 1; pen = pz + R; }
              }
              nx = ex * c + ez * sn; nz = -ex * sn + ez * c;
            }
          } else {
            const ux = -dx / d, uz = -dz / d;
            const sup = polySupport(p, ux, uz);
            if (p.sides >= 3 && p.sides < 12) { const Rc = p.baseR * m.scale.x, ap = Rc * Math.cos(Math.PI / p.sides), t = Math.max(0, Math.min(1, (sup - ap) / (Rc - ap))); sharp = t * t * (3 - 2 * t); }
            const H = 2 * he.y;
            for (let k = 0; k < N; k++) {
              const y = yLo + (yHi - yLo) * k / (N - 1);
              const Rs = (slimeSurfR((y - sp.y) / S) * S + 0.06 * S);
              const reach = sup * (p.shape === 2 ? Math.max(0.06, 1 - (y - baseY) / H) : 1);
              if (Rs + reach - d > pen) { pen = Rs + reach - d; cR = Rs; }
            }
            nx = ux; nz = uz;
          }
          if (pen > 0) {
            sp.x += nx * pen; sp.z += nz * pen;
            impactDir.set(-nx, 0, -nz);
            p.touch = slimeState.time; p.cnx = nx; p.cnz = nz;
            sharpAmt += (sharp - sharpAmt) * 0.35;
            contactR = cR / S;
            touchTime = slimeState.time;
            const vdot = velocity.x * nx + velocity.z * nz;
            if (vdot < 0) {
              const vin = -vdot;
              // slime hitting a wall: it does not bounce, it sticks. Kill the incoming speed completely...
              velocity.x -= nx * vdot; velocity.z -= nz * vdot;
              // ...and drag it a little along the surface so it clings instead of skating.
              const tx = -nz, tz = nx, vt = velocity.x * tx + velocity.z * tz, fr = (1 - Math.exp(-5 * frameDt)) * (1 - 0.65 * sharp); // corners let it slide off instead of clinging
              velocity.x -= tx * vt * fr; velocity.z -= tz * vt * fr;
              p.hitCd = p.hitCd || 0;
              if (vin > 0.5 && slimeState.time - p.hitCd > 0.3) {
                p.hitCd = slimeState.time;
                // splat strength grows faster than linearly with impact speed: soft at a walk, big at a sprint (10)
                const sev = Math.min(1, Math.pow(vin / 9, 0.9));
                splatV += sev * 28 * (1 + 0.5 * sharp);
                triggerSlimePoke(
                  new THREE.Vector3(-nx, -0.15, -nz).normalize().multiplyScalar(1.6),
                  new THREE.Vector3(nx * 1.6 * sev, 0.18 * sev, nz * 1.6 * sev)
                );
              }
            }
          }
        }
}

function relaxSolids() {
  const lim = 1.8 * slimeScale * 0.75;
  for (let it = 0; it < 2; it++)
    for (const p of props) if (p.state === 'idle' && p.radius >= lim) collideSolid(p);
}


function updateEatUniforms() {
  const U = slimeMaterial.uniforms, S = slimeScale, sp = slimeMesh.position;
  const pos = U.uEatPos.value, par = U.uEatParam.value;
  const hb = U.uBoxHalf.value;
  for (let i = 0; i < 6; i++) { par[i].set(0, 0, 0); hb[i].set(0.01, 0.01, 0.01); }
  let pa = 0;
  const pressing = props.filter(p => p.state === 'idle' && p.pd > 0.004 && p.pRo > 0).sort((a, b) => b.pd - a.pd).slice(0, 3);
  for (let i = 0; i < pressing.length; i++) {
    const p = pressing[i], m = p.mesh.position;
    const dx = m.x - sp.x, dz = m.z - sp.z, d = Math.max(Math.hypot(dx, dz), 1e-4);
    const yl = (m.y - sp.y) / S;
    const dv = (slimeSurfR(yl) * S + p.pRo - p.pd) / S;
    pos[i].set(dx / d * dv, yl, dz / d * dv);
    const a = Math.min(1, p.pd / p.pThr);
    par[i].set(p.shape + p.sides * 0.01, 1, p.mesh.rotation.y + p.phase);
    setBoxHalf(hb[i], p, S);
    if (a > pa) { pa = a; U.uPressDir.value.set(dx / d, 0, dz / d); }
  }
  pressAmt += (pa - pressAmt) * 0.25;
  U.uPressAmt.value = pressAmt;
  let near = 0;
  for (const p of props) {
    if (p.state !== 'idle' || !(p.pRo > 0)) continue;
    const gap = Math.hypot(p.mesh.position.x - sp.x, p.mesh.position.z - sp.z) - (1.9 * S + p.pRo);
    near = Math.max(near, Math.min(1, Math.max(0, 1 - gap / (1.5 * S + p.pRo))));
  }
  calm += (Math.max(near, pressAmt) - calm) * 0.2;
  let slot = 3;
  for (const p of props) {
    if (p.state !== 'eating' || slot > 5) continue;
    const m = p.mesh.position;
    pos[slot].set((m.x - sp.x) / S, (m.y - sp.y) / S, (m.z - sp.z) / S);
    par[slot].set(p.shape + p.sides * 0.01, 1, p.mesh.rotation.y + p.phase);
    setBoxHalf(hb[slot], p, S);
    slot++;
  }
}

// Feeds the obstacles the slime is squashed against to the shader, pushed into the jelly by the splat depth,
// along the true contact normal, so the body takes the obstacle's actual outline (edge-on vs corner-on look different).
function updateSolidUniforms() {
  const U = slimeMaterial.uniforms, S = slimeScale, sp = slimeMesh.position;
  const pos = U.uSolidPos.value, par = U.uSolidParam.value, hb = U.uSolidHalf.value, dr = U.uSolidDir.value;
  for (let i = 0; i < 2; i++) { par[i].set(0, 0, 0); hb[i].set(0.01, 0.01, 0.01); dr[i].set(0, 0, 0); }
  const act = props.filter(p => p.state === 'idle' && p.touch !== undefined && slimeState.time - p.touch < 1.2)
    .sort((a, b) => b.touch - a.touch).slice(0, 2);
  const depth = Math.min(1.2, Math.max(splatX, spreadX * 0.5) * (0.5 + 0.7 * sharpAmt));
  for (let i = 0; i < act.length; i++) {
    const p = act[i], m = p.mesh.position;
    pos[i].set((m.x - sp.x) / S + p.cnx * depth, (m.y - sp.y) / S, (m.z - sp.z) / S + p.cnz * depth);
    dr[i].set(-p.cnx, 0, -p.cnz);
    const fade = 1 - Math.min(1, Math.max(0, (slimeState.time - p.touch - 0.8) / 0.4));
    par[i].set(p.shape + p.sides * 0.01, fade, p.mesh.rotation.y + p.phase);
    setBoxHalf(hb[i], p, S);
  }
}

const SLIME_MELT = 0.28;
function slimeSurfR(yl) {
  const k = 0.86 - SLIME_MELT * 0.22, gF = -1.6 * k;
  const f = (y) => { const b = y - gF; if (b < 0.9) { const t = Math.max(0, b / 0.9); return gF + 0.9 * (2 * t * t - t * t * t); } return y; };
  let lo = gF, hi = 1.6 * k;
  for (let i = 0; i < 18; i++) { const mid = (lo + hi) * 0.5; if (f(mid) < yl) lo = mid; else hi = mid; }
  const py = Math.max(-1.6, Math.min(1.6, lo / k));
  const h = (py / 1.6 + 1) * 0.5;
  const sm = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const spread = 1 + (Math.pow(1 - h, 1.35) * sm(0, 0.22, h) * 0.34 + Math.sin(h * Math.PI) * 0.08) * (0.8 + SLIME_MELT * 1.1);
  return Math.max(0.3, Math.sqrt(Math.max(0, 2.56 - py * py)) * spread);
}

function halfOf(p) { return p.half.clone().multiplyScalar(p.mesh.scale.x); }

// Reach of a prism/pyramid from its center toward a horizontal world direction (vertex = circumradius, face = apothem)
function polySupport(p, ux, uz) {
  const R = p.baseR * p.mesh.scale.x;
  if (p.sides < 3 || p.sides >= 12) return R;
  const ca = Math.cos(p.mesh.rotation.y), sa = Math.sin(p.mesh.rotation.y);
  const lx = ux * ca - uz * sa, lz = ux * sa + uz * ca;
  const sector = Math.PI * 2 / p.sides;
  let d = (Math.atan2(lx, lz) - p.phase) % sector;
  if (d < 0) d += sector;
  const fromFace = Math.abs(d - sector / 2);
  return R * Math.cos(sector / 2) / Math.cos(fromFace);
}

function setBoxHalf(v, p, S) {
  const he = halfOf(p);
  if (p.shape === 0) v.copy(he).divideScalar(S);
  else { const R = p.baseR * p.mesh.scale.x; v.set(R, he.y, R).divideScalar(S); }
}

function obbCollide(a, b) {
  const qa = a.mesh.quaternion, qb = b.mesh.quaternion;
  const A = [new THREE.Vector3(1, 0, 0).applyQuaternion(qa), new THREE.Vector3(0, 1, 0).applyQuaternion(qa), new THREE.Vector3(0, 0, 1).applyQuaternion(qa)];
  const B = [new THREE.Vector3(1, 0, 0).applyQuaternion(qb), new THREE.Vector3(0, 1, 0).applyQuaternion(qb), new THREE.Vector3(0, 0, 1).applyQuaternion(qb)];
  const ha = halfOf(a), hb = halfOf(b);
  const t = new THREE.Vector3().subVectors(b.mesh.position, a.mesh.position);
  const axes = [...A, ...B];
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
    const cr = new THREE.Vector3().crossVectors(A[i], B[j]);
    if (cr.lengthSq() > 1e-6) axes.push(cr.normalize());
  }
  let best = Infinity, bestAxis = null;
  for (const ax of axes) {
    const ra = Math.abs(A[0].dot(ax)) * ha.x + Math.abs(A[1].dot(ax)) * ha.y + Math.abs(A[2].dot(ax)) * ha.z;
    const rb = Math.abs(B[0].dot(ax)) * hb.x + Math.abs(B[1].dot(ax)) * hb.y + Math.abs(B[2].dot(ax)) * hb.z;
    const dist = t.dot(ax);
    const overlap = ra + rb - Math.abs(dist);
    if (overlap <= 0) return null;
    if (overlap < best) { best = overlap; bestAxis = dist < 0 ? ax.clone().negate() : ax.clone(); }
  }
  return { n: bestAxis, depth: best };
}

function updateInside(dt) {
  const S = slimeScale, sp = slimeMesh.position;
  const list = insideProps.filter(p => p.state === 'eating');
  for (const p of list) {
    p.vel.y -= 7 * dt;
    p.vel.multiplyScalar(Math.exp(-2.0 * dt));
    p.mesh.position.addScaledVector(p.vel, dt);
  }
  for (let it = 0; it < 6; it++) {
    for (let i = 0; i < list.length; i++) {
      for (let j = i + 1; j < list.length; j++) {
        const a = list[i], b = list[j];
        const hit = obbCollide(a, b);
        if (!hit) continue;
        const nx = hit.n.x, ny = hit.n.y, nz = hit.n.z;
        const push = Math.min(hit.depth / 2 + 0.002, 0.3);
        a.mesh.position.x -= nx * push; a.mesh.position.y -= ny * push; a.mesh.position.z -= nz * push;
        b.mesh.position.x += nx * push; b.mesh.position.y += ny * push; b.mesh.position.z += nz * push;
        const vrel = (b.vel.x - a.vel.x) * nx + (b.vel.y - a.vel.y) * ny + (b.vel.z - a.vel.z) * nz;
        if (vrel < 0) {
          const jv = -1.3 * vrel / 2;
          a.vel.x -= nx * jv; a.vel.y -= ny * jv; a.vel.z -= nz * jv;
          b.vel.x += nx * jv; b.vel.y += ny * jv; b.vel.z += nz * jv;
        }
      }
    }
  }
  for (const p of list) {
    const m = p.mesh, he = halfOf(p), rr = Math.max(he.x, he.y, he.z) * 0.8;
    const Rh = Math.max(0.15, 1.6 * S - rr), Rv = Math.max(0.15, 1.15 * S - rr);
    const lx = m.position.x - sp.x, ly = m.position.y - sp.y, lz = m.position.z - sp.z;
    const qx = lx / Rh, qy = ly / Rv, qz = lz / Rh;
    const ql = Math.hypot(qx, qy, qz);
    if (ql > 1) {
      m.position.set(sp.x + lx / ql, sp.y + ly / ql, sp.z + lz / ql);
      let nx = qx / Rh, ny = qy / Rv, nz = qz / Rh;
      const nl = Math.hypot(nx, ny, nz) || 1;
      nx /= nl; ny /= nl; nz /= nl;
      const vn = p.vel.x * nx + p.vel.y * ny + p.vel.z * nz;
      if (vn > 0) { p.vel.x -= nx * vn * 1.4; p.vel.y -= ny * vn * 1.4; p.vel.z -= nz * vn * 1.4; }
    }
    if (m.position.y < -1.2 + he.y) {
      m.position.y = -1.2 + he.y;
      if (p.vel.y < 0) p.vel.y *= -0.2;
    }
  }
}

function updateEyes() {
  if (velocity.length() > 0.3) {
    let diff = Math.atan2(crawlDir.x, crawlDir.z) - facingYaw;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    facingYaw += diff * (1 - Math.exp(-8 / 60));
  }
  slimeMaterial.uniforms.uFacing.value = facingYaw;
  slimeMaterial.uniforms.uBlink.value = (slimeState.time % 4.0) > 3.85 ? 0.12 : 1.0;
}

let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  frameDt = dt;

  slimeState.time += dt;
  slimeState.impulseTime += dt;
  slimeMaterial.uniforms.uTime.value = slimeState.time;
  slimeMaterial.uniforms.uImpulseTime.value = slimeState.impulseTime;

  const inZ = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const inX = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  camera.getWorldDirection(_fwd);
  _fwd.y = 0; _fwd.normalize();
  _right.crossVectors(_fwd, UP);
  _desired.set(0, 0, 0).addScaledVector(_fwd, inZ).addScaledVector(_right, inX);
  curMax = (keys.ShiftLeft || keys.ShiftRight) ? 10.0 : 3.0;
  if (_desired.lengthSq() > 0) _desired.normalize().multiplyScalar(curMax);
  velocity.lerp(_desired, 1 - Math.exp(-8 * dt));

  slimeMesh.position.addScaledVector(velocity, dt);
  scene.userData.shadow.position.x = slimeMesh.position.x;
  scene.userData.shadow.position.z = slimeMesh.position.z;
  const maxR = 190;
  const flat = Math.hypot(slimeMesh.position.x, slimeMesh.position.z);
  if (flat > maxR) {
    slimeMesh.position.x *= maxR / flat;
    slimeMesh.position.z *= maxR / flat;
  }
  slimeScale += (targetScale - slimeScale) * (1 - Math.exp(-3 * dt));
  slimeMesh.scale.setScalar(slimeScale);
  slimeMesh.position.y = -1.2 + 1.2 * slimeScale;
  scene.userData.shadow.scale.set(slimeScale, 1, slimeScale);
  if (Math.abs(slimeScale - lastScale) > 1e-4) {
    cameraState.radius *= slimeScale / lastScale;
    cameraState.target.y = slimeMesh.position.y + 0.15 * slimeScale;
    lastScale = slimeScale;
    updateCameraPosition();
  }
  updateProps(dt);
  relaxSolids();
  {
    // Splat dynamics. Compression snaps in fast; releasing is slow and viscous (the goo clings to the wall before it
    // peels away); sideways spread lags behind the compression. Every spring is critically damped: nothing rebounds.
    const since = slimeState.time - touchTime;
    const tgt = since < 0.12 ? 0.16 : (since < 0.3 ? 0.08 : 0);
    const kS = splatV > 0 ? 120 : 40;
    splatV += (kS * (tgt - splatX) - 2 * Math.sqrt(kS) * splatV) * dt;
    splatX = Math.max(0, Math.min(1.1, splatX + splatV * dt));
    if (splatX === 0 && splatV < 0) splatV = 0;
    const kP = splatX > spreadX ? 70 : 22;
    spreadV += (kP * (splatX - spreadX) - 2 * Math.sqrt(kP) * spreadV) * dt;
    spreadX = Math.max(0, spreadX + spreadV * dt);
    if (spreadX === 0 && spreadV < 0) spreadV = 0;
    const U2 = slimeMaterial.uniforms;
    U2.uSplat.value = splatX * (1 - 0.8 * sharpAmt);
    U2.uSpread.value = spreadX * (1 - 0.6 * sharpAmt);
    U2.uWall.value = contactR;
    U2.uSplatDir.value.copy(impactDir);
  }
  updateInside(dt);
  updateEatUniforms();
  updateSolidUniforms();
  const speed01 = Math.min(velocity.length() / 3.0, 1);
  if (velocity.length() > 0.05) crawlDir.copy(velocity).setY(0).normalize();
  crawlPhase += velocity.length() * dt * 2.6;
  slimeMaterial.uniforms.uMoveDir.value.copy(crawlDir);
  slimeMaterial.uniforms.uMoveAmt.value = speed01 * (1 - 0.95 * calm);
  slimeMaterial.uniforms.uCrawl.value = crawlPhase;
  _t.set(velocity.x * 0.35 * (1 - calm), 0, velocity.z * 0.35 * (1 - calm)).sub(lean);
  leanVel.addScaledVector(_t, 60 * dt).addScaledVector(leanVel, -7 * dt);
  lean.addScaledVector(leanVel, dt);
  if (slimeState.time - touchTime < 0.2) { leanVel.set(0, 0, 0); lean.multiplyScalar(Math.exp(-14 * dt)); }
  slimeMaterial.uniforms.uLean.value.copy(lean);
  slimeMaterial.uniforms.uRippleIntensity.value = 0.12 + 0.45 * speed01;

  if (speed01 > 0.01) {
    cameraState.target.x = slimeMesh.position.x;
    cameraState.target.z = slimeMesh.position.z;
    updateCameraPosition();
  }

  updateEyes();
  const hud = 'Eaten ' + eaten + ' / ' + props.length + '  ·  Size ' + slimeScale.toFixed(2) + '×';
  if (hud !== hudText) { hudText = hud; document.getElementById('hudStat').textContent = hud; }
  slimeMesh.visible = false;
  renderer.setRenderTarget(refractionRenderTarget);
  renderer.render(scene, camera);

  renderer.setRenderTarget(null);
  slimeMesh.visible = true;
  renderer.render(scene, camera);
}

window.onload = init;
</script>
